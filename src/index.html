<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Parcel Project</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="todo-app">
            <h1>My To-Do List</h1>
            <form class="todo-form">
                <input type="text" class="todo-input" placeholder="Введіть задачу..." />
                <button type="submit">Додати</button>
            </form>
            <ul class="todo-list"></ul>
            <div class="filters">
                <button data-filter="all">Усі</button>
                <button data-filter="active">Невиконані</button>
                <button data-filter="completed">Виконані</button>
            </div>
        </div>

        <script src="./index.js" type="module"></script>
    </body>
</html>
